<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliCup</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ============================================================
         SEÇÃO 1 — CABEÇALHO / MENU
         Responsável: (Thiago)
    ============================================================= -->
    <header id="cabecalho">
        <!-- logo, nome do site e menu de navegação aqui -->
    </header>


    <!-- ============================================================
         SEÇÃO 2 — HOME
         Responsável: (nome)
    ============================================================= -->
    <section id="home">
        <!-- título de impacto, frase curta e talvez um botão -->
    </section>


    <!-- ============================================================
         SEÇÃO 3 — SOBRE A DELICUP
         Responsável: (nome)
    ============================================================= -->
    <section id="sobre">
        <!-- o que é o DeliCup, proposta do projeto -->
    </section>


    <!-- ============================================================
         SEÇÃO 4 — PRODUTOS
         Responsável: (nome)
    ============================================================= -->
    <section id="produtos">
        <!-- cards com os produtos/itens oferecidos -->
    </section>


    <!-- ============================================================
         SEÇÃO 5 — COMO FUNCIONA / DIFERENCIAIS
         Responsável: (nome)
    ============================================================= -->
    <section id="como-funciona">
        <!-- passo a passo ou pontos fortes do serviço -->
    </section>


    <!-- ============================================================
         SEÇÃO 6 — NOSSA HISTÓRIA
         Responsável: (nome)
    ============================================================= -->
    <section id="nossa-historia">
        <!-- descrição da empresa -->
    </section>


    <!-- ============================================================
         SEÇÃO 7 — MISSÃO, VISÃO E VALORES
         Responsável: (nome)
    ============================================================= -->
    <section id="mvv">
        <!-- pontos fortes da empresa com missão, visão e valores -->
    </section>


    <!-- ============================================================
         SEÇÃO 8 — EQUIPE
         Responsável: (nome)
    ============================================================= -->
    <section id="equipe">
        <!-- Descrição da equipe de GCOM -->
    </section>


    <!-- ============================================================
         SEÇÃO 9 — CONTATO / LOCALIZAÇÃO
         Responsável: (Thiago)
    ============================================================= -->
    <section id="contato">
        <!-- formulário de contato, endereço, redes sociais -->
    </section>


    <!-- ============================================================
         SEÇÃO 10 — RODAPÉ (FOOTER)
         Responsável: (Thiago)
    ============================================================= -->
    <footer id="rodape">
        <!-- direitos autorais, links úteis, redes sociais -->
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
